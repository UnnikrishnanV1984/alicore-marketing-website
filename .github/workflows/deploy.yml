name: Build & deploy

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/deploy.yml']
  pull_request:
    paths: ['site/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22, not 20: wrangler's undici dependency requires >=22.19.
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
          # Phone, WhatsApp, email, address and social links are NOT set here.
          # Staff edit them in the admin console and they live in site_settings;
          # a copy in CI variables would be a second source of truth that goes
          # stale the first time someone changes a number.
          #
          # This makes the build fail rather than fall back to the offline
          # defaults if that row cannot be read -- publishing a stale phone
          # number under a green deploy is worse than a failed one.
          PUBLIC_REQUIRE_DB: '1'

      - name: Deploy to Cloudflare
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          command: deploy

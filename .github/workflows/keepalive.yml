name: Supabase keepalive

# Supabase pauses free-tier projects after ~7 days with no API traffic. A
# low-traffic marketing site can easily go a week without an enquiry, which
# would silently break the contact form. One cheap request a day prevents it.
# See docs/IMPLEMENTATION_PLAN.md section 1.

on:
  schedule:
    - cron: '17 4 * * *' # 04:17 UTC daily -- off the hour to dodge scheduler pileups
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # PUBLIC_SITE_URL, not a SITE_URL secret: the secret was never set, so
      # every run from at least 2026-10-22 curled a bare "/api/health" and
      # died with "No host part in the URL" -- twelve days of a red cron that
      # was not keeping anything alive. The site URL is not a secret, and the
      # build already holds one source of truth for it.
      - name: Ping health endpoint
        env:
          SITE: ${{ vars.PUBLIC_SITE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SITE:-}" ]; then
            echo "::error::PUBLIC_SITE_URL is not set -- nothing to ping"
            exit 1
          fi
          code=$(curl -sS -o /tmp/body -w '%{http_code}' \
            --retry 3 --retry-delay 10 --max-time 30 \
            "${SITE%/}/api/health")
          echo "HTTP $code"
          cat /tmp/body
          echo
          if [ "$code" != "200" ]; then
            echo "::error::Health check failed with HTTP $code"
            exit 1
          fi

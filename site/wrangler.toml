name = "alicore-site"
main = "./dist/_worker.js/index.js"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Serve on <name>.<subdomain>.workers.dev while alicore.in is not yet delegated
# to Cloudflare. Every page carries meta robots=noindex on a workers.dev host
# (see layouts/Base.astro) so the staging URL cannot compete with the real
# domain later.
workers_dev = true

# ---------------------------------------------------------------------------
# GOING LIVE ON alicore.in
#
# The apex is canonical, not www -- that decision is already baked into
# content/site.ts, robots.txt.ts and astro.config.mjs, which all default to
# https://alicore.in.
#
# The domain resolves and is out of registrar hold, but it is still on GoDaddy
# DNS (ns53/ns54.domaincontrol.com) serving their parked lander, and the
# Cloudflare account has no zone for it. A `routes` entry naming a zone that
# does not exist makes `wrangler deploy` FAIL, which would take the whole
# pipeline down -- so the block below stays commented until the nameservers
# move. Order matters:
#
#   1. Add alicore.in as a zone in Cloudflare; point GoDaddy's nameservers at
#      the two it gives you. Nothing to preserve -- the domain has no MX and
#      no TXT records, only the parking A records.
#   2. Uncomment the routes line below.
#   3. Set the PUBLIC_SITE_URL Actions variable to https://alicore.in. That one
#      value switches the canonical tags, robots.txt from its staging form to
#      production (which is what starts advertising the sitemap), the sitemap
#      URLs, og:image and the JSON-LD.
#   4. Redirect www -> apex with a Cloudflare Redirect Rule on the zone
#      (hostname eq "www.alicore.in" -> 301 https://alicore.in${path}). It has
#      to be a zone rule, not middleware: assets are served ahead of the Worker
#      here, so a redirect in code would never run for a static page.
#   5. Point Supabase Auth's Site URL at https://alicore.in so staff password
#      reset links stop landing on workers.dev.
#
# Keep workers_dev = true through the switch. It costs nothing, stays noindex,
# and is the way back in if the custom domain misbehaves.
# ---------------------------------------------------------------------------
# routes = [{ pattern = "alicore.in", custom_domain = true }]

[assets]
directory = "./dist"
binding = "ASSETS"
# Astro emits about/index.html and every canonical/internal link is written
# without a trailing slash. Cloudflare's default ("auto-trailing-slash") would
# 307 /about -> /about/, costing a hop on every link and making the served URL
# disagree with the canonical tag. Drop the slash so the two match.
html_handling = "drop-trailing-slash"

[observability]
enabled = true

# ---------------------------------------------------------------------------
# Secrets are NOT set here -- wrangler.toml is committed. Set each one with:
#
#   wrangler secret put SUPABASE_SERVICE_ROLE_KEY
#   wrangler secret put TURNSTILE_SECRET_KEY
#   wrangler secret put RESEND_API_KEY
#   wrangler secret put ENQUIRY_NOTIFY_TO
#   wrangler secret put IP_HASH_SALT
#   wrangler secret put GITHUB_DISPATCH_TOKEN
#   wrangler secret put CF_ZONE_ID
#   wrangler secret put CF_PURGE_TOKEN
#
# GITHUB_REPO is not secret and can live in [vars] below.
#
# PUBLIC_* values are inlined at build time from .env / CI environment, so they
# belong in the build environment rather than in secrets.
# ---------------------------------------------------------------------------

# Non-secret configuration for the admin Publish button. The token that goes
# with these is a secret and is set with `wrangler secret put`.
[vars]
GITHUB_REPO = "UnnikrishnanV1984/alicore-marketing-website"
GITHUB_WORKFLOW = "deploy.yml"
GITHUB_BRANCH = "main"

# Astro's Cloudflare adapter wires sessions to a KV namespace. The public site
# does not use sessions (staff auth rides on signed cookies), but the binding
# must exist or the Worker refuses to boot. The namespace is named
# alicore-site-SESSION in the account; the binding stays SESSION, which is the
# name the adapter looks for. The id is an identifier, not a credential.
[[kv_namespaces]]
binding = "SESSION"
id = "25c6fe7b0d124c3d9fd717c134d9b6cc"
